name: Android APK

# Builds the signed app on every push to main and publishes it as a GitHub
# release – the newest APK is always one tap away on the phone.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SIMPLEARCHIVE_KEYSTORE_BASE64    the keystore file, base64-encoded
#   SIMPLEARCHIVE_KEYSTORE_PASSWORD  its password
# The key itself never lives in this repo (see README → Signieren).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the version code is the commit count

      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.SIMPLEARCHIVE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIMPLEARCHIVE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Signierschlüssel fehlt::Die Secrets SIMPLEARCHIVE_KEYSTORE_BASE64 und SIMPLEARCHIVE_KEYSTORE_PASSWORD sind nicht gesetzt – siehe README, Abschnitt Signieren."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/simplearchive.jks"
          echo "SIMPLEARCHIVE_KEYSTORE=$RUNNER_TEMP/simplearchive.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm test
      - run: npm run android:sync

      - name: Signierte APK bauen
        working-directory: android
        env:
          SIMPLEARCHIVE_KEYSTORE_PASSWORD: ${{ secrets.SIMPLEARCHIVE_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: APK nach Version benennen
        run: |
          VERSION="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").$(git rev-list --count HEAD)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk "simpleArchive-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: simpleArchive-${{ env.VERSION }}
          path: simpleArchive-*.apk

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          NOTES="simpleArchive $VERSION ($(git log -1 --pretty=%s)). APK am Handy öffnen und installieren – Updates behalten dein Archiv."
          gh release create "$TAG" "simpleArchive-$VERSION.apk" --title "simpleArchive $VERSION" --notes "$NOTES" --target "$GITHUB_SHA" --latest \
            || gh release upload "$TAG" "simpleArchive-$VERSION.apk" --clobber
